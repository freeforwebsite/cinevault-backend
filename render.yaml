services:
  - type: web
    name: cinevault-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: TELEGRAM_SESSION_STRING
        sync: false
      - key: GEMINI_API_KEY
        sync: false
